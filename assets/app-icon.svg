<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Warm obsidian-espresso cabinet background -->
    <linearGradient id="bg" x1="0.12" y1="0.04" x2="0.92" y2="0.96">
      <stop offset="0%" stop-color="#2E2624"/>
      <stop offset="50%" stop-color="#1E1918"/>
      <stop offset="100%" stop-color="#130F0F"/>
    </linearGradient>

    <!-- Warm studio top-left key light -->
    <radialGradient id="top-light" cx="0.22" cy="0.14" r="0.72">
      <stop offset="0%" stop-color="#FFEDD8" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#B53660" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#130F0F" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft rose-burgundy ambient glow behind the vinyl disc -->
    <radialGradient id="rose-glow" cx="0.46" cy="0.54" r="0.48">
      <stop offset="0%" stop-color="#CC4370" stop-opacity="0.44"/>
      <stop offset="56%" stop-color="#8A2246" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1A1514" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle warm champagne corner light behind pivot -->
    <radialGradient id="gold-glow" cx="0.80" cy="0.22" r="0.34">
      <stop offset="0%" stop-color="#F5D6AA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F5D6AA" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer squircle glass rim highlight -->
    <linearGradient id="rim-stroke" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFF2E2" stop-opacity="0.34"/>
      <stop offset="40%" stop-color="#D9A78B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.44"/>
    </linearGradient>

    <!-- Deep obsidian vinyl body -->
    <radialGradient id="vinyl-body" cx="0.36" cy="0.32" r="0.76">
      <stop offset="0%" stop-color="#2C2726"/>
      <stop offset="46%" stop-color="#181515"/>
      <stop offset="86%" stop-color="#100D0D"/>
      <stop offset="100%" stop-color="#090707"/>
    </radialGradient>

    <!-- Velvety rose-burgundy center label -->
    <radialGradient id="label-grad" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0%" stop-color="#E45A84"/>
      <stop offset="46%" stop-color="#B53660"/>
      <stop offset="88%" stop-color="#872245"/>
      <stop offset="100%" stop-color="#6A1936"/>
    </radialGradient>

    <!-- Champagne-gold metallic ring -->
    <linearGradient id="gold-ring" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#FBE9CE"/>
      <stop offset="48%" stop-color="#E2B57F"/>
      <stop offset="100%" stop-color="#B67F4F"/>
    </linearGradient>

    <!-- Brushed warm silver tonearm -->
    <linearGradient id="arm-metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF9F4"/>
      <stop offset="42%" stop-color="#E2D7CD"/>
      <stop offset="78%" stop-color="#B5A69B"/>
      <stop offset="100%" stop-color="#8A7C72"/>
    </linearGradient>

    <!-- Gimbal pivot base -->
    <radialGradient id="pivot-base" cx="0.35" cy="0.32" r="0.72">
      <stop offset="0%" stop-color="#4B423E"/>
      <stop offset="65%" stop-color="#282220"/>
      <stop offset="100%" stop-color="#161211"/>
    </radialGradient>

    <!-- Sleek burgundy-gold cartridge -->
    <linearGradient id="cartridge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4CE9F"/>
      <stop offset="48%" stop-color="#CC4872"/>
      <stop offset="100%" stop-color="#872144"/>
    </linearGradient>

    <!-- Soft studio Gaussian blur for realistic anisotropic vinyl sheen -->
    <filter id="sheen-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <!-- Soft drop shadows -->
    <filter id="disc-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#050303" flood-opacity="0.72"/>
    </filter>
    <filter id="arm-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="18" stdDeviation="16" flood-color="#060404" flood-opacity="0.62"/>
    </filter>
    <filter id="label-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- Smooth iOS/macOS style squircle clip -->
    <clipPath id="icon-clip">
      <rect x="28" y="28" width="968" height="968" rx="224" ry="224"/>
    </clipPath>

    <clipPath id="disc-clip">
      <circle cx="468" cy="540" r="356"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon-clip)">
    <!-- Base cabinet -->
    <rect x="28" y="28" width="968" height="968" fill="url(#bg)"/>
    <rect x="28" y="28" width="968" height="968" fill="url(#top-light)"/>
    <rect x="28" y="28" width="968" height="968" fill="url(#rose-glow)"/>
    <rect x="28" y="28" width="968" height="968" fill="url(#gold-glow)"/>

    <!-- Subtle recessed platter ring -->
    <circle cx="468" cy="540" r="380" fill="none" stroke="#F7EAE0" stroke-opacity="0.065" stroke-width="3.5"/>

    <!-- Vinyl record -->
    <g filter="url(#disc-shadow)">
      <circle cx="468" cy="540" r="356" fill="url(#vinyl-body)"/>
    </g>

    <g clip-path="url(#disc-clip)">
      <!-- Silky blurred anisotropic light lobes (real vinyl reflection) -->
      <g filter="url(#sheen-blur)">
        <path d="M 468 540 L 110 210 L 320 110 Z" fill="#FFF3E5" fill-opacity="0.28"/>
        <path d="M 468 540 L 826 870 L 616 970 Z" fill="#FFF1E2" fill-opacity="0.22"/>
        <path d="M 468 540 L 760 215 L 870 365 Z" fill="#F28AA8" fill-opacity="0.18"/>
      </g>

      <!-- Concentric micro-grooves -->
      <g fill="none" stroke-linecap="round">
        <circle cx="468" cy="540" r="340" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="2.4"/>
        <circle cx="468" cy="540" r="318" stroke="#F8E7D8" stroke-opacity="0.075" stroke-width="2.0"/>
        <circle cx="468" cy="540" r="296" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.8"/>
        <circle cx="468" cy="540" r="274" stroke="#F8E7D8" stroke-opacity="0.095" stroke-width="2.2"/>
        <circle cx="468" cy="540" r="252" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1.8"/>
        <circle cx="468" cy="540" r="230" stroke="#F8E7D8" stroke-opacity="0.09" stroke-width="2.2"/>
        <circle cx="468" cy="540" r="208" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1.8"/>
        <circle cx="468" cy="540" r="186" stroke="#F8E7D8" stroke-opacity="0.085" stroke-width="2.0"/>
        <!-- Crisp specular groove glints -->
        <path d="M 244 352 A 296 296 0 0 1 398 252" stroke="#FFF6EC" stroke-opacity="0.42" stroke-width="3.2"/>
        <path d="M 276 392 A 244 244 0 0 1 406 303" stroke="#FFF6EC" stroke-opacity="0.30" stroke-width="2.6"/>
        <path d="M 548 822 A 296 296 0 0 0 696 718" stroke="#F9DFCC" stroke-opacity="0.28" stroke-width="3.0"/>
        <path d="M 538 773 A 244 244 0 0 0 662 682" stroke="#F9DFCC" stroke-opacity="0.20" stroke-width="2.4"/>
      </g>

      <!-- Outer edge bevel -->
      <circle cx="468" cy="540" r="354" fill="none" stroke="#FFF1E4" stroke-opacity="0.16" stroke-width="3"/>
    </g>

    <!-- Rose-burgundy center label with champagne-gold editorial rings -->
    <g filter="url(#label-shadow)">
      <circle cx="468" cy="540" r="144" fill="url(#label-grad)"/>
    </g>
    <circle cx="468" cy="540" r="143" fill="none" stroke="url(#gold-ring)" stroke-width="5" stroke-opacity="0.94"/>
    <circle cx="468" cy="540" r="110" fill="none" stroke="#FCEAD2" stroke-width="2" stroke-opacity="0.34"/>
    <path d="M 364 460 A 130 130 0 0 1 542 432" fill="none" stroke="#FFF6ED" stroke-opacity="0.40" stroke-width="4" stroke-linecap="round"/>

    <!-- Center spindle recess + champagne-gold pin -->
    <circle cx="468" cy="540" r="34" fill="#171312" stroke="#F7E4CC" stroke-opacity="0.30" stroke-width="2.5"/>
    <circle cx="468" cy="540" r="14" fill="url(#gold-ring)"/>
    <circle cx="463" cy="535" r="4.5" fill="#FFF8EE" fill-opacity="0.88"/>

    <!-- Sleek Precision Tonearm in top-right -->
    <g filter="url(#arm-shadow)">
      <!-- Gimbal pivot assembly -->
      <circle cx="806" cy="242" r="70" fill="url(#pivot-base)" stroke="url(#gold-ring)" stroke-width="4.5" stroke-opacity="0.78"/>
      <circle cx="806" cy="242" r="46" fill="#1A1514" stroke="#EFE4DA" stroke-opacity="0.24" stroke-width="2.5"/>

      <!-- Main sculpted metallic arm tube -->
      <path d="M 806 242 C 798 362, 780 448, 744 526 C 724 570, 694 608, 658 642"
            fill="none" stroke="url(#arm-metal)" stroke-width="20" stroke-linecap="round"/>
      <!-- Crisp top metallic specular line along the tube -->
      <path d="M 802 242 C 794 360, 776 446, 740 524 C 720 568, 690 606, 654 640"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="4.5" stroke-linecap="round"/>

      <!-- Pivot cap -->
      <circle cx="806" cy="242" r="24" fill="url(#arm-metal)"/>
      <circle cx="806" cy="242" r="9.5" fill="#B53660"/>

      <!-- Tapered headshell & cartridge resting cleanly on the groove -->
      <g transform="translate(652 648) rotate(42)">
        <rect x="-18" y="-14" width="40" height="62" rx="11" fill="url(#cartridge)" stroke="#FCEAD4" stroke-opacity="0.58" stroke-width="2.2"/>
        <rect x="-9" y="23" width="22" height="5.5" rx="2.75" fill="url(#gold-ring)"/>
        <circle cx="2" cy="40" r="4.2" fill="#FFF5EA"/>
      </g>
    </g>

    <!-- Inner edge bevel frame -->
    <rect x="30" y="30" width="964" height="964" rx="222" ry="222" fill="none" stroke="url(#rim-stroke)" stroke-width="5"/>
  </g>
</svg>
