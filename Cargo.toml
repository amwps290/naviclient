[package]
name = "navidrome-client"
version = "0.1.0"
edition = "2021"
description = "A native Rust GUI client for Navidrome"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "6"
env_logger = "0.11"
log = "0.4"
gpui-kit = "0.7.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
rand = "0.8"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rodio = { version = "0.22", features = ["symphonia-alac"] }
cpal = "0.17.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
url = "2"
tray-icon = "0.24.2"
biquad = "0.6.0"

[target.'cfg(target_os = "linux")'.dependencies]
# 系统通知：D-Bus org.freedesktop.Notifications（服务器端显示封面图）。
notify-rust = { version = "4", default-features = false }
# Linux 托盘：纯 Rust StatusNotifierItem over D-Bus，无需 GTK/libappindicator。
ksni = { version = "0.3", features = ["blocking"] }
zbus = "5.19"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# 发布体积优化（MSVC 后端，调试符号走外部 PDB，exe 无内嵌符号）。
# 逐项实测：基线 34.6MB → +thin LTO/CGU=1/strip 31.2MB → fat LTO
# 30.5MB → opt-level="s" 22.4MB（-35%）。
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"

# 解码与实时音频路径保持全速：symphonia（解码器）、本 crate
# （音频工作线程的取样/增益/EQ/响度统计）。
[profile.release.package.symphonia]
opt-level = 3

[profile.release.package."symphonia-core"]
opt-level = 3

[dev-dependencies]
gpui-pre = { package = "gpui-pre", version = "0.3.8", features = ["test-support"] }
