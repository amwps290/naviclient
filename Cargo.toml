[package]
name = "navidrome-client"
version = "0.1.0"
edition = "2021"
description = "A native Rust GUI client for Navidrome"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
directories = "6"
env_logger = "0.11"
log = "0.4"
gpui = "0.2.2"
gpui-component = "0.5.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rodio = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
url = "2"

[profile.release]
opt-level = 2
